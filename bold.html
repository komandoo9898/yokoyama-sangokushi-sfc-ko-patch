<style>
:root {
  color-scheme: light dark;
  --bg: #f4f5f7; --card: #ffffff; --fg: #1c1e21; --muted: #5f6368; --line: #cfd4da;
  --accent: #1f6feb; --accent-fg: #ffffff; --ok: #1a7f37; --warn: #9a6700; --err: #cf222e;
  --drop: #eef3fb; --drop-over: #dbe9ff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171a; --card: #22252a; --fg: #e6e8eb; --muted: #9aa0a6; --line: #3c4149;
    --accent: #4493f8; --accent-fg: #0b0f14; --ok: #3fb950; --warn: #d29922; --err: #ff7b72;
    --drop: #1b2430; --drop-over: #24344a;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  line-height: 1.6; font-size: 16px;
}
main { max-width: 560px; margin: 0 auto; padding: 24px 16px 32px; }
h1 { font-size: 1.35rem; margin: 0 0 6px; word-break: keep-all; }
.lead { margin: 0 0 20px; color: var(--muted); font-size: .95rem; word-break: keep-all; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
.drop {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  min-height: 150px; padding: 16px; text-align: center;
  border: 2px dashed var(--line); border-radius: 10px; background: var(--drop); cursor: pointer;
}
.drop.over { background: var(--drop-over); border-color: var(--accent); }
.drop span { word-break: keep-all; }
.drop input[type=file] { max-width: 100%; font: inherit; color: var(--fg); }
#status { margin: 16px 0 0; min-height: 1.6em; font-weight: 600; word-break: keep-all; }
#status.ok { color: var(--ok); }
#status.warn { color: var(--warn); }
#status.err { color: var(--err); }
#info { margin: 4px 0 0; min-height: 1.2em; font-size: .85rem; color: var(--muted); word-break: keep-all; }
button {
  margin-top: 14px; width: 100%; padding: 12px 16px; border: 0; border-radius: 8px;
  background: var(--accent); color: var(--accent-fg); font: inherit; font-weight: 600; cursor: pointer;
}
button:disabled { opacity: .45; cursor: not-allowed; }
footer { margin-top: 28px; font-size: .85rem; color: var(--muted); }
footer p { margin: 4px 0; word-break: keep-all; }
@media (max-width: 380px) { main { padding: 16px 12px 24px; } .card { padding: 14px; } }
</style>

<main>
  <h1>横山光輝 三國志 (SFC) 한글 패치 v0.8.1 — 굵게체</h1>
  <p class="lead">원본 롬은 브라우저 안에서만 처리되며 서버로 전송되지 않습니다.</p>

      <input type="file" id="file" accept=".sfc,.smc,.bin,.rom">

    notOrig: '원본 롬이 아닙니다. Rev 1 판(SHA-256 41470267…ac30)이 필요합니다.',
    done: '패치 완료 — 검증됨',
    warn: '패치 완료 — 검증 실패: 결과 SHA-256이 기대값과 다릅니다. 내려받을 수는 있지만 정상 동작을 보장할 수 없습니다.',
    headerRemoved: '512바이트 복사기 헤더를 제거했습니다.',
    readErr: '파일을 읽지 못했습니다.'
  };

  function fail(msg) {
    var e = new Error(msg);
    e.userMessage = msg;
    return e;
  }

  function fmt(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  // ---- SHA-256 (순수 JS 폴백) ----
  var K = [
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
  ];

  function rotr(x, n) {
    return (x >>> n) | (x << (32 - n));
  }

  function sha256Js(bytes) {
    var n = bytes.length;
    var total = ((n + 9 + 63) >>> 6) << 6;
    var buf = new Uint8Array(total);
    buf.set(bytes);
    buf[n] = 0x80;
    var dv = new DataView(buf.buffer);
    var bits = n * 8;
    dv.setUint32(total - 8, Math.floor(bits / 4294967296));
    dv.setUint32(total - 4, bits >>> 0);
    var H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
    var W = new Uint32Array(64);
    var off, i, x, y, s0, s1, a, b, c, d, e, f, g, h, S0, S1, ch, maj, t1, t2;
    for (off = 0; off < total; off += 64) {
      for (i = 0; i < 16; i++) W[i] = dv.getUint32(off + i * 4);
      for (i = 16; i < 64; i++) {
        x = W[i - 15];
        y = W[i - 2];
        s0 = rotr(x, 7) ^ rotr(x, 18) ^ (x >>> 3);
        s1 = rotr(y, 17) ^ rotr(y, 19) ^ (y >>> 10);
        W[i] = (W[i - 16] + s0 + W[i - 7] + s1) | 0;
      }
      a = H[0]; b = H[1]; c = H[2]; d = H[3]; e = H[4]; f = H[5]; g = H[6]; h = H[7];
      for (i = 0; i < 64; i++) {
        S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
        ch = (e & f) ^ (~e & g);
        t1 = (h + S1 + ch + K[i] + W[i]) | 0;
        S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
        maj = (a & b) ^ (a & c) ^ (b & c);
        t2 = (S0 + maj) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0;
        d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
      H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
    }
    var hex = '';
    for (i = 0; i < 8; i++) hex += ('00000000' + (H[i] >>> 0).toString(16)).slice(-8);
    return hex;
  }

  function toHex(ab) {
    var u = new Uint8Array(ab), s = '';
    for (var i = 0; i < u.length; i++) s += (u[i] < 16 ? '0' : '') + u[i].toString(16);
    return s;
  }

  // crypto.subtle을 먼저 쓰고, 막혀 있거나 실패하면 순수 JS 구현으로 계산한다.
  function sha256(bytes) {
    var subtle = (typeof crypto !== 'undefined' && crypto) ? crypto.subtle : undefined;
    if (subtle && typeof subtle.digest === 'function') {
      return Promise.resolve().then(function () {
        return subtle.digest('SHA-256', bytes);
      }).then(toHex, function () {
        return sha256Js(bytes);
      });
    }
    return Promise.resolve(sha256Js(bytes));
  }

  // ---- 롬 준비 (512B 복사기 헤더 처리) ----
  function prepareRom(ab) {
    var len = ab.byteLength;
    if (len === ORIG_LEN) return { data: new Uint8Array(ab), headerRemoved: false };
    if (len === ORIG_LEN + HDR_LEN) return { data: new Uint8Array(ab, HDR_LEN), headerRemoved: true };
    return null;
  }

  function b64ToBytes(s) {
    var bin = atob(s), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }

  // ---- IPS 적용 (표준 파서) ----
  // PATCH, 레코드 [3B 오프셋, 2B 크기; 크기 0이면 2B 길이 + 1B 값(RLE)], EOF(3B), 선택적 3B 잘라내기 길이.
  // 'EOF'는 레코드 시작 위치에서 먼저 검사한다(표준). 결과 길이는 max(원본 길이, 최대 기록 위치).
  function applyIps(ips, src) {
    var n = ips.length, p, off, size, rle, val, rest, trunc = -1, cap, out, r, rc;
    if (n < 8 || String.fromCharCode(ips[0], ips[1], ips[2], ips[3], ips[4]) !== 'PATCH') {
      throw fail('IPS 파일이 아닙니다(PATCH 헤더 없음).');
    }
    var recs = [], maxEnd = src.length;
    p = 5;
    for (;;) {
      if (p + 3 > n) throw fail('IPS 파일이 EOF 없이 끝났습니다.');
      if (ips[p] === 0x45 && ips[p + 1] === 0x4f && ips[p + 2] === 0x46) { p += 3; break; }
      off = (ips[p] << 16) | (ips[p + 1] << 8) | ips[p + 2];
      if (p + 5 > n) throw fail('IPS 레코드 헤더가 잘렸습니다.');
      size = (ips[p + 3] << 8) | ips[p + 4];
      p += 5;
      if (size === 0) {
        if (p + 3 > n) throw fail('IPS RLE 레코드가 잘렸습니다.');
        rle = (ips[p] << 8) | ips[p + 1];
        val = ips[p + 2];
        p += 3;
        recs.push({ off: off, len: rle, val: val, data: null });
        if (off + rle > maxEnd) maxEnd = off + rle;
      } else {
        if (p + size > n) throw fail('IPS 데이터 레코드가 잘렸습니다.');
        recs.push({ off: off, len: size, val: 0, data: ips.subarray(p, p + size) });
        p += size;
        if (off + size > maxEnd) maxEnd = off + size;
      }
    }
    rest = n - p;
    if (rest === 3) trunc = (ips[p] << 16) | (ips[p + 1] << 8) | ips[p + 2];
    else if (rest !== 0) throw fail('IPS 끝부분이 올바르지 않습니다.');

    cap = Math.max(maxEnd, trunc);
    out = new Uint8Array(cap);
    out.set(src);
    for (r = 0; r < recs.length; r++) {
      rc = recs[r];
      if (rc.data) out.set(rc.data, rc.off);
      else out.fill(rc.val, rc.off, rc.off + rc.len);
    }
    return trunc >= 0 ? out.subarray(0, trunc) : out.subarray(0, maxEnd);
  }

  // ---- 전체 흐름 ----
  function runPatch(ab) {
    return Promise.resolve().then(function () {
      var prep = prepareRom(ab);
      if (!prep) throw fail(MSG.sizeErr);
      return sha256(prep.data).then(function (origHex) {
        if (origHex !== ORIG_SHA) throw fail(MSG.notOrig);
        var out;
        try {
          out = applyIps(b64ToBytes(IPS_B64), prep.data);
        } catch (e) {
          throw fail('패치 적용 실패: ' + (e && e.message ? e.message : e));
        }
        return sha256(out).then(function (resHex) {
          return {
            data: out,
            headerRemoved: prep.headerRemoved,
            resultSha: resHex,
            verified: resHex === RESULT_SHA
          };
        });
      });
    });
  }

  // ---- 화면 ----
  function init() {
    var $file = document.getElementById('file');
    var $drop = document.getElementById('drop');
    var $status = document.getElementById('status');
    var $info = document.getElementById('info');
    var $btn = document.getElementById('dl');
    if (!$file || !$drop || !$status || !$info || !$btn) return;
    var current = null, token = 0;

    function setStatus(msg, kind) {
      $status.textContent = msg;
      $status.className = kind || '';
    }
    function setInfo(msg) {
      $info.textContent = msg || '';
    }
    function over(e) {
      e.preventDefault();
      $drop.classList.add('over');
    }
    function leave() {
      $drop.classList.remove('over');
    }

    function handle(file) {
      if (!file) return;
      var my = ++token;
      current = null;
      $btn.disabled = true;
      setInfo('');
      setStatus(MSG.checking, '');
      var reader = new FileReader();
      reader.onerror = function () {
        if (my === token) setStatus(MSG.readErr, 'err');
      };
      reader.onload = function () {
        setStatus(MSG.applying, '');
        runPatch(reader.result).then(function (r) {
          if (my !== token) return;
          current = r;
          var parts = [];
          if (r.headerRemoved) parts.push(MSG.headerRemoved);
          parts.push('결과 크기 ' + fmt(r.data.length) + '바이트.');
          setInfo(parts.join(' '));
          if (r.verified) setStatus(MSG.done, 'ok');
          else setStatus(MSG.warn, 'warn');
          $btn.disabled = false;
        }, function (e) {
          if (my !== token) return;
          setStatus((e && e.userMessage) || ('패치 적용 중 오류: ' + (e && e.message)), 'err');
        });
      };
      reader.readAsArrayBuffer(file);
    }

    $file.addEventListener('change', function () {
      handle(this.files && this.files[0]);
    });
    $drop.addEventListener('dragenter', over);
    $drop.addEventListener('dragover', over);
    $drop.addEventListener('dragleave', leave);
    $drop.addEventListener('drop', function (e) {
      e.preventDefault();
      leave();
      handle(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]);
    });
    // 드롭 영역 밖에 떨어뜨려도 브라우저가 파일을 열지 않게 한다.
    window.addEventListener('dragover', function (e) { e.preventDefault(); });
    window.addEventListener('drop', function (e) { e.preventDefault(); });

    $btn.addEventListener('click', function () {
      if (!current) return;
      var blob = new Blob([current.data], { type: 'application/octet-stream' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = OUT_NAME;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
    });
  }

  window.KoPatch = {
    runPatch: runPatch,
    applyIps: applyIps,
    sha256: sha256,
    sha256Js: sha256Js,
    prepareRom: prepareRom,
    b64ToBytes: b64ToBytes,
    ORIG_SHA: ORIG_SHA,
    RESULT_SHA: RESULT_SHA
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
